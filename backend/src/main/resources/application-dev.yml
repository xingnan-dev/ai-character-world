spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:mysql://127.0.0.1:3307/ai_virtual_companion?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: '123456'

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      encoding: UTF-8
      continue-on-error: true

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: "dev-ai-virtual-companion-jwt-secret-key-must-be-at-least-32-characters-long"
  expiration: 7200

ai:
  api-url: "https://api.example.com/v1/chat/completions"
  api-key: "your-dev-api-key-here"
  model-name: "gpt-3.5-turbo"
  mock:
    enabled: true

logging:
  level:
    root: INFO
    com.companion: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

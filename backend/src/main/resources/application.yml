server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      enabled: true
      charset: UTF-8
      force: true
      force-request: true
      force-response: true

spring:
  application:
    name: ai-virtual-companion
  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/ai_virtual_companion?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    out-of-order: false

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.companion.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:}
  expiration: 7200
  issuer: ai-virtual-companion
  audience: ai-virtual-companion-web
  header: Authorization
  prefix: "Bearer "

ai:
  provider: ${AI_PROVIDER:openai-compatible}
  api-url: ${AI_API_URL:https://api.example.com/v1/chat/completions}
  api-key: ${AI_API_KEY:}
  model-name: ${AI_MODEL_NAME:gpt-3.5-turbo}
  temperature: ${AI_TEMPERATURE:0.7}
  max-tokens: ${AI_MAX_TOKENS:1024}
  connect-timeout: 30s
  read-timeout: 120s
  mock:
    enabled: ${AI_MOCK_ENABLED:false}
  stream:
    include-usage: ${AI_STREAM_INCLUDE_USAGE:true}
    require-completion-signal: ${AI_STREAM_REQUIRE_COMPLETION_SIGNAL:true}
  avatar:
    max-tokens: ${AVATAR_MAX_TOKENS:1536}
  context:
    window-tokens: ${AI_CONTEXT_WINDOW_TOKENS:8192}
    safety-margin-tokens: ${AI_CONTEXT_SAFETY_MARGIN_TOKENS:512}
    max-history-messages: ${AI_CONTEXT_MAX_HISTORY_MESSAGES:100}
  memory:
    candidate-limit: ${AI_MEMORY_CANDIDATE_LIMIT:100}
    retrieval-limit: ${AI_MEMORY_RETRIEVAL_LIMIT:20}

logging:
  level:
    root: INFO
    com.companion: DEBUG

app:
  redis:
    enabled: false
  world:
    execution:
      core-pool-size: 2
      max-pool-size: 2
      queue-capacity: 32
      shutdown-await-seconds: 30

chat:
  message-recovery-timeout: ${CHAT_MESSAGE_RECOVERY_TIMEOUT:5m}

avatar:
  asset:
    minimum-score: ${AVATAR_ASSET_MINIMUM_SCORE:10}

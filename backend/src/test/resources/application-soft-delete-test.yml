spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:soft_delete_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:soft-delete-schema.sql
      data-locations: classpath:soft-delete-data.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: soft-delete-test-jwt-secret-key-at-least-32-bytes

ai:
  mock:
    enabled: true

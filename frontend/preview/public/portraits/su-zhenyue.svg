<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" role="img" aria-label="原创角色肖像：苏枕月">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232139"/>
      <stop offset=".52" stop-color="#171a30"/>
      <stop offset="1" stop-color="#0b0f20"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d6c29a" stop-opacity=".3"/>
      <stop offset="1" stop-color="#d6c29a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-lilac" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b9a6d8" stop-opacity=".26"/>
      <stop offset="1" stop-color="#b9a6d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#332a41"/>
      <stop offset=".55" stop-color="#1e1a2c"/>
      <stop offset="1" stop-color="#0f0d1a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d9c8"/>
      <stop offset=".62" stop-color="#e8c2ad"/>
      <stop offset="1" stop-color="#c99a8c"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ece7de"/>
      <stop offset=".55" stop-color="#d3cfd2"/>
      <stop offset="1" stop-color="#a6a5b8"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2d6" stop-opacity=".8"/>
      <stop offset="1" stop-color="#d6c29a" stop-opacity=".05"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="320" height="400" rx="20" fill="url(#bg)"/>
  <circle cx="238" cy="106" r="126" fill="url(#glow)"/>
  <circle cx="70" cy="304" r="110" fill="url(#glow-lilac)"/>

  <!-- faint star-chart orbits -->
  <g fill="none" stroke="#d6c29a" opacity=".2">
    <ellipse cx="164" cy="172" rx="128" ry="48" transform="rotate(-18 164 172)"/>
    <ellipse cx="164" cy="172" rx="152" ry="70" transform="rotate(12 164 172)"/>
    <circle cx="45" cy="228" r="1.4" fill="#d6c29a" opacity=".6"/>
    <circle cx="282" cy="264" r="1.2" fill="#d6c29a" opacity=".5"/>
  </g>

  <g fill="#fbf3e2">
    <path d="M54 84 56.5 92.5 65 95 56.5 97.5 54 106 51.5 97.5 43 95 51.5 92.5Z" opacity=".45"/>
    <path d="M270 154 272 160 278 162 272 164 270 170 268 164 262 162 268 160Z" opacity=".34"/>
    <circle cx="292" cy="78" r="1.3" opacity=".42"/>
  </g>

  <!-- hair back and low bun -->
  <path d="M160 52 C114 52 86 88 90 140 C94 196 78 246 70 310 C66 328 78 336 94 330 L116 320 L114 196 L206 196 L208 322 L238 332 C254 336 264 322 258 304 C244 242 228 194 232 140 C234 88 206 52 160 52Z" fill="url(#hair)"/>
  <ellipse cx="235" cy="116" rx="42" ry="38" fill="url(#hair)" transform="rotate(-14 235 116)"/>
  <path d="M208 94 C222 80 248 82 260 98 C248 88 226 88 212 102Z" fill="#4a3b52" opacity=".42"/>
  <g fill="#d6c29a">
    <circle cx="250" cy="106" r="2.2" opacity=".7"/>
    <circle cx="262" cy="122" r="1.4" opacity=".5"/>
    <circle cx="240" cy="132" r="1.2" opacity=".45"/>
  </g>
  <path d="M100 158 C90 220 84 268 80 314" fill="none" stroke="#5b4b66" stroke-width="1.6" opacity=".3"/>

  <!-- body -->
  <path d="M36 400 C42 346 78 306 120 294 L200 294 C244 304 280 346 286 400Z" fill="url(#top)"/>
  <path d="M128 294 C140 314 146 328 160 336 C174 328 180 314 192 294 L200 298 C194 330 180 350 160 358 C140 350 126 330 120 298Z" fill="#c8c3c8" opacity=".6"/>
  <path d="M160 336 L160 400" stroke="#9d9aa9" stroke-width="1" opacity=".3"/>
  <path d="M96 316 C74 344 58 374 50 400" fill="none" stroke="#e9e1da" stroke-width="1.4" opacity=".34"/>
  <path d="M226 318 C248 344 264 374 272 400" fill="none" stroke="#e9e1da" stroke-width="1.4" opacity=".28"/>

  <!-- neck and ears -->
  <path d="M142 236 L178 236 L185 292 C170 308 150 308 135 292Z" fill="#d4a99a"/>
  <ellipse cx="112" cy="164" rx="7" ry="15" fill="url(#skin)"/>
  <ellipse cx="208" cy="164" rx="7" ry="15" fill="url(#skin)"/>
  <ellipse cx="112" cy="164" rx="3.5" ry="9" fill="#c9988b" opacity=".32"/>

  <!-- face -->
  <path d="M112 128 C112 94 132 80 160 80 C188 80 208 94 208 128 C208 170 198 202 178 218 C170 225 162 226 154 220 C132 204 112 170 112 128Z" fill="url(#skin)"/>
  <path d="M118 186 C126 209 140 220 154 222 C144 207 132 197 126 178Z" fill="#d3a497" opacity=".2"/>

  <!-- side-parted hair -->
  <path d="M108 148 C104 98 128 62 160 62 C196 60 223 94 214 148 C207 128 196 110 180 100 C164 118 136 120 112 106 C102 118 96 132 108 148Z" fill="url(#hair)"/>
  <path d="M109 142 C100 176 103 214 115 238 C103 239 95 216 97 188 C99 166 104 152 109 142Z" fill="url(#hair)"/>
  <path d="M212 142 C221 176 218 212 207 238 C219 236 226 212 224 186 C222 166 218 152 212 142Z" fill="url(#hair)"/>
  <path d="M114 112 C136 96 166 94 184 108" fill="none" stroke="#5b4b66" stroke-width="1.8" opacity=".34"/>
  <path d="M190 104 C201 116 208 132 212 146" fill="none" stroke="#6a5a78" stroke-width="1.4" opacity=".24"/>
  <path d="M196 92 C208 84 218 88 222 100" fill="none" stroke="#6a5a78" stroke-width="1.3" opacity=".22"/>

  <!-- brows, eyes -->
  <path d="M128 145 Q139 140 150 144" fill="none" stroke="#4a343b" stroke-width="2.5" stroke-linecap="round" opacity=".76"/>
  <path d="M170 144 Q181 140 192 145" fill="none" stroke="#4a343b" stroke-width="2.5" stroke-linecap="round" opacity=".76"/>
  <path d="M129 160 Q139 153 149 160 Q139 167 129 160Z" fill="#f6eee7"/>
  <path d="M171 160 Q181 153 191 160 Q181 167 171 160Z" fill="#f6eee7"/>
  <circle cx="140" cy="159" r="3.4" fill="#41354a"/>
  <circle cx="180" cy="159" r="3.4" fill="#41354a"/>
  <circle cx="141" cy="158" r="1" fill="#fbf4ee" opacity=".72"/>
  <circle cx="181" cy="158" r="1" fill="#fbf4ee" opacity=".72"/>
  <path d="M128 159 Q139 152 150 159" fill="none" stroke="#392a31" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M170 159 Q181 152 192 159" fill="none" stroke="#392a31" stroke-width="2.1" stroke-linecap="round"/>

  <!-- nose, lips -->
  <path d="M160 170 C158 178 156 184 160 187 C163 188 166 186 166 183" fill="none" stroke="#c08c80" stroke-width="1.8" stroke-linecap="round" opacity=".68"/>
  <path d="M150 199 Q160 195 170 199 Q165 206 157 206 Q152 204 150 199Z" fill="#b1717b"/>
  <path d="M153 199 Q160 196 167 199" fill="none" stroke="#89505b" stroke-width="1" opacity=".64"/>
  <ellipse cx="132" cy="184" rx="13" ry="6" fill="#dc9fa3" opacity=".24" filter="url(#soft)"/>
  <ellipse cx="188" cy="184" rx="12" ry="6" fill="#dc9fa3" opacity=".2" filter="url(#soft)"/>

  <!-- gold earring and rim light -->
  <circle cx="209" cy="189" r="2" fill="#c6a96f"/>
  <circle cx="210" cy="201" r="4.8" fill="none" stroke="#e0cfa7" stroke-width="1.4"/>
  <path d="M207 118 C211 150 205 186 184 212" fill="none" stroke="url(#rim)" stroke-width="4.5" opacity=".6" filter="url(#soft)"/>
  <path d="M110 300 C76 322 54 358 44 400" fill="none" stroke="#f5e5c8" stroke-width="2" opacity=".2" filter="url(#soft)"/>

  <g fill="#fff6e3">
    <circle cx="246" cy="240" r="1.5" opacity=".35"/>
    <circle cx="86" cy="254" r="1.2" opacity=".3"/>
    <circle cx="278" cy="350" r="1.2" opacity=".26"/>
  </g>
</svg>

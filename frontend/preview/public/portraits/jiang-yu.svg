<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" role="img" aria-label="原创角色肖像：江屿">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18253f"/>
      <stop offset=".55" stop-color="#111b32"/>
      <stop offset="1" stop-color="#090e1f"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b8d8e8" stop-opacity=".32"/>
      <stop offset="1" stop-color="#b8d8e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-gold" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d6c29a" stop-opacity=".26"/>
      <stop offset="1" stop-color="#d6c29a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303a54"/>
      <stop offset=".6" stop-color="#1a2238"/>
      <stop offset="1" stop-color="#0c1020"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c3ae"/>
      <stop offset=".6" stop-color="#d6ac98"/>
      <stop offset="1" stop-color="#b58275"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3654"/>
      <stop offset=".6" stop-color="#1c243c"/>
      <stop offset="1" stop-color="#111728"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8d4d2"/>
      <stop offset="1" stop-color="#8f8fa2"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8f0f8" stop-opacity=".8"/>
      <stop offset="1" stop-color="#b8d8e8" stop-opacity=".05"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="320" height="400" rx="20" fill="url(#bg)"/>
  <circle cx="64" cy="104" r="126" fill="url(#glow)"/>
  <circle cx="270" cy="318" r="110" fill="url(#glow-gold)"/>

  <g fill="#e4f1f5">
    <path d="M262 64 264.5 72.5 273 75 264.5 77.5 262 86 259.5 77.5 251 75 259.5 72.5Z" opacity=".45"/>
    <path d="M58 242 60 248 66 250 60 252 58 258 56 252 50 250 56 248Z" opacity=".3"/>
    <circle cx="284" cy="132" r="1.3" opacity=".38"/>
    <circle cx="74" cy="188" r="1.1" opacity=".3"/>
  </g>

  <!-- shoulders -->
  <path d="M28 400 C34 344 72 306 116 294 L204 294 C250 304 286 344 292 400Z" fill="url(#coat)"/>
  <path d="M122 296 L160 350 L198 296 L208 300 L224 400 L96 400 L112 300Z" fill="#151b2e"/>
  <path d="M126 300 L158 344 L150 356 L112 306Z" fill="url(#shirt)"/>
  <path d="M194 300 L160 344 L168 356 L208 308Z" fill="url(#shirt)"/>
  <path d="M160 342 L160 400" stroke="#8a8ea7" stroke-width="1" opacity=".32"/>
  <path d="M98 318 C76 342 60 374 52 400" fill="none" stroke="#44506f" stroke-width="1.4" opacity=".34"/>
  <path d="M222 318 C244 342 262 374 270 400" fill="none" stroke="#44506f" stroke-width="1.4" opacity=".3"/>

  <!-- neck -->
  <path d="M140 236 L180 236 L188 294 C172 310 148 310 132 294Z" fill="url(#skin)"/>
  <path d="M134 280 C150 294 170 294 186 280 L190 294 C172 310 148 310 130 294Z" fill="#9c6d67" opacity=".42"/>

  <!-- ears -->
  <ellipse cx="112" cy="164" rx="8" ry="15" fill="#d6ac98"/>
  <ellipse cx="208" cy="164" rx="8" ry="15" fill="url(#skin)"/>

  <!-- face (slightly squarer jaw) -->
  <path d="M112 128 C112 96 132 80 160 80 C188 80 208 96 208 128 C208 170 200 204 182 220 C174 228 164 230 156 225 C134 209 112 170 112 128Z" fill="url(#skin)"/>
  <path d="M125 206 C140 219 152 223 162 222 C151 211 140 203 132 190Z" fill="#bd8c7f" opacity=".2"/>

  <!-- short hair -->
  <path d="M109 140 C104 96 128 66 160 64 C196 62 219 92 214 140 C209 126 200 112 190 104 C181 117 157 122 141 114 C130 124 118 134 109 140Z" fill="url(#hair)"/>
  <path d="M108 138 C102 118 106 98 116 84 C110 108 112 124 118 138Z" fill="#161d32"/>
  <path d="M213 136 C218 116 214 96 204 82 C210 106 208 122 202 136Z" fill="#161d32"/>
  <path d="M134 92 C154 78 180 78 198 94" fill="none" stroke="#566584" stroke-width="1.6" opacity=".36"/>
  <path d="M111 118 C124 100 142 90 160 88" fill="none" stroke="#4d5a79" stroke-width="1.2" opacity=".24"/>
  <path d="M190 99 C201 108 209 122 213 138" fill="none" stroke="#647394" stroke-width="1.2" opacity=".24"/>

  <!-- brows and eyes -->
  <path d="M128 145 Q140 139 152 144" fill="none" stroke="#3d2f32" stroke-width="3" stroke-linecap="round" opacity=".82"/>
  <path d="M169 144 Q181 139 193 145" fill="none" stroke="#3d2f32" stroke-width="3" stroke-linecap="round" opacity=".82"/>
  <path d="M129 162 Q140 155 151 162 Q140 168 129 162Z" fill="#f0e8e1"/>
  <path d="M169 162 Q180 155 191 162 Q180 168 169 162Z" fill="#f0e8e1"/>
  <circle cx="141" cy="161" r="3.6" fill="#3b354c"/>
  <circle cx="180" cy="161" r="3.6" fill="#3b354c"/>
  <circle cx="142" cy="160" r="1" fill="#faf3ed" opacity=".7"/>
  <circle cx="181" cy="160" r="1" fill="#faf3ed" opacity=".7"/>
  <path d="M128 161 Q140 154 152 161" fill="none" stroke="#33292e" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M168 161 Q180 154 192 161" fill="none" stroke="#33292e" stroke-width="2.2" stroke-linecap="round"/>

  <!-- nose and lips -->
  <path d="M160 170 C157 180 156 185 160 189 C164 190 167 187 167 184" fill="none" stroke="#b27c70" stroke-width="1.9" stroke-linecap="round" opacity=".68"/>
  <path d="M150 202 Q160 198 170 202 Q165 209 157 209 Q152 207 150 202Z" fill="#a8666d"/>
  <path d="M153 202 Q160 199 167 202" fill="none" stroke="#7f4b55" stroke-width="1" opacity=".6"/>
  <ellipse cx="131" cy="186" rx="13" ry="6" fill="#c98f80" opacity=".22" filter="url(#soft)"/>
  <ellipse cx="189" cy="186" rx="12" ry="6" fill="#c98f80" opacity=".2" filter="url(#soft)"/>

  <!-- collar detail and rim light -->
  <path d="M126 300 L158 344" fill="none" stroke="#f1f3f5" stroke-width="1.3" opacity=".36"/>
  <path d="M194 300 L162 344" fill="none" stroke="#f1f3f5" stroke-width="1.3" opacity=".32"/>
  <path d="M114 112 C110 146 116 188 134 210" fill="none" stroke="url(#rim)" stroke-width="4" opacity=".5" filter="url(#soft)"/>
  <path d="M108 300 C78 320 58 354 48 396" fill="none" stroke="#d8eef7" stroke-width="2" opacity=".22" filter="url(#soft)"/>

  <!-- small gold pin -->
  <circle cx="220" cy="326" r="3" fill="#c6ab78" opacity=".65"/>
  <circle cx="220" cy="326" r="7" fill="#d6c29a" opacity=".12" filter="url(#soft)"/>

  <g fill="#f5f5ef">
    <circle cx="252" cy="224" r="1.4" opacity=".34"/>
    <circle cx="92" cy="344" r="1.2" opacity=".28"/>
    <circle cx="276" cy="86" r="1.1" opacity=".32"/>
  </g>
</svg>
